[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[project]
name = "needledrop"
version = "0.1.2"
description = "Audio fingerprinting service for vinyl record identification"
requires-python = ">=3.12"
license-files = ["LICENSE"]
dependencies = [
    "shazamio",
    "pylast",
    "pyyaml",
    "aiohttp",
    "pillow",
    "pydub",
    "audioop-lts; python_version >= '3.13'",
]

[project.scripts]
needledrop = "needledrop.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
