[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "needledrop"
version = "0.1.0"
description = "Audio fingerprinting service for vinyl record identification"
requires-python = ">=3.12"
dependencies = [
    "shazamio",
    "pylast",
    "pyyaml",
    "aiohttp",
    "pillow",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
