---
name: ci

on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.24"
      - run: uv sync --locked
      - run: uv run --locked pytest tests/ -v

  nix:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.24"
      # Compared as PEP 440 versions: `uv version` writes 1.2.0-rc.1 as 1.2.0rc1, and both spellings are pre-releases.
      - name: Compute and check version
        id: version
        run: |
          uv run --no-project --with packaging python - <<'EOF'
          import os
          import tomllib

          from packaging.version import InvalidVersion, Version

          tag = os.environ["TAG"].removeprefix("v")
          try:
              version = Version(tag)
          except InvalidVersion:
              print(f"::error::tag {tag} is not a PEP 440 version")
              raise SystemExit(1)
          with open("pyproject.toml", "rb") as f:
              project = Version(tomllib.load(f)["project"]["version"])
          if project != version:
              print(f"::error::pyproject.toml says {project}, but the tag is {tag}")
              raise SystemExit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"version={tag}", file=out)
              print(f"is_release={str(not version.is_prerelease).lower()}", file=out)
          EOF
        env:
          TAG: ${{ github.ref_name }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (versioned)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/andyattebery/needledrop:${{ steps.version.outputs.version }}
      - name: Promote :latest
        if: steps.version.outputs.is_release == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/andyattebery/needledrop:latest \
            "ghcr.io/andyattebery/needledrop:${VERSION}"
        env:
          VERSION: ${{ steps.version.outputs.version }}
